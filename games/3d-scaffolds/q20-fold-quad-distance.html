<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q20 · Fold quad distance · Type D scaffold</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/font/Serif/cmun-serif.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/font/Sans/cmun-sans.css">
<style>

:root{
  --bg:#1C1C1C;--bg2:#141414;--card:#232323;--line:#3a3a3a;--ink:#ECECEC;--ink2:#9a9a9a;
  --blue:#58C4DD;--green:#83C167;--yellow:#FFFF00;--red:#FC6255;--gold:#F0AC5F;--teal:#5CD0B3;
  --serif:"Computer Modern Serif","Latin Modern Roman","CMU Serif","Cambria Math",Georgia,serif;
  --sans:"Computer Modern Sans","CMU Sans Serif","Helvetica Neue",Arial,system-ui,sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button{font:inherit;color:inherit}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:100vh;height:100dvh}
.stage{position:relative;background:var(--bg);border-right:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
.stage:focus-visible{box-shadow:inset 0 0 0 2px var(--blue)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.ov{position:absolute;left:14px;right:14px;display:flex;gap:8px;pointer-events:none}
.ov.top{top:14px}
.ov.bot{bottom:14px;justify-content:space-between;align-items:flex-end}
.tag{pointer-events:auto;background:rgba(20,20,20,.82);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:13px;max-width:100%;color:var(--ink)}
.tag.tool{border-color:var(--yellow);color:var(--yellow)}
.tag .muted{color:var(--ink2)}
.tag.btnish{cursor:pointer}
.tag.btnish:hover{border-color:var(--blue);color:var(--blue)}
.toast{position:absolute;left:50%;bottom:64px;transform:translate(-50%,8px);width:max-content;max-width:min(92%,540px);background:#000;border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .35s var(--ease),transform .35s var(--ease);pointer-events:none;z-index:3}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--red);color:var(--red)}
.toast.good{border-color:var(--green);color:var(--green)}
.panel{overflow-y:auto;padding:16px 16px 30px;background:var(--bg2)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.01em}
.brand i{color:var(--blue);font-style:italic}
.back{font-size:13px;color:var(--ink2);text-decoration:none}
.back:hover{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:10px}
.eyebrow{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;color:var(--ink2);margin-bottom:6px;text-transform:uppercase}
.qtext{margin:0 0 8px;font-size:14.5px}
.ask{margin:0;font-family:var(--serif);font-size:17px;line-height:1.55}
.mth{font-family:var(--serif);font-style:italic}
.step{display:flex;align-items:flex-start;gap:10px;padding:6px 0;opacity:.4;transition:opacity .4s}
.step.on,.step.ok{opacity:1}
.step .n{width:24px;height:24px;border:1px solid var(--ink2);border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;font-family:var(--serif);margin-top:1px}
.step.on .n{border-color:var(--yellow);color:var(--yellow)}
.step.ok .n{border-color:var(--green);color:var(--bg);background:var(--green)}
.step .t{flex:1;font-size:14px}
.sec{font-size:12px;letter-spacing:.06em;color:var(--ink2);margin:0 0 8px;text-transform:uppercase}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:#1a1a1a;border-radius:6px;padding:8px 10px;cursor:pointer;font-size:14px;text-align:left;transition:border-color .2s,color .2s,background .2s}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.on{border-color:var(--yellow);color:var(--yellow)}
.btn.dark{border-color:var(--blue);color:var(--blue)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.good{border-color:var(--green);color:var(--green)}
.btn .sym{font-family:var(--serif);margin-right:6px;color:var(--yellow)}
.btn small{display:block;font-size:12px;color:var(--ink2)}
.howto{margin:10px 0 0;font-size:13px;padding:8px;border:1px dashed var(--yellow);border-radius:6px;color:var(--ink)}
.msg{padding:9px 11px;border:1px solid var(--line);border-left:3px solid var(--ink2);border-radius:6px;background:var(--card);margin-bottom:10px;font-size:14px}
.msg.good{border-left-color:var(--green)}
.msg.bad{border-left-color:var(--red)}
.hints{margin:0;padding-left:18px;font-size:14px}
.hints li{margin:4px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#1a1a1a;font-family:var(--serif);font-style:italic;font-size:18px;cursor:pointer}
.chip.a{border-style:dashed;color:var(--ink2)}
.chip.c{color:var(--yellow);border-color:rgba(255,255,0,.5)}
.chip.sel{background:var(--yellow);color:#111;border-color:var(--yellow)}
.chip.tsel{background:rgba(255,255,0,.25);color:var(--yellow)}
.chip:disabled{opacity:.5;cursor:default}
.mc{display:grid;gap:6px}
.mc .btn{text-align:left}
.mc .btn.picked-good{border-color:var(--green);color:var(--green);background:rgba(131,193,103,.08)}
.mc .btn.picked-bad{border-color:var(--red);color:var(--red)}
.explain{border-left:3px solid var(--red)}
.explain h3{margin:0 0 6px;font-family:var(--serif);font-weight:normal;font-size:20px;color:var(--red)}
.explain p{margin:6px 0;font-size:14px}
.eq{font-family:var(--serif);font-size:17px;text-align:center;margin:10px 0;color:var(--ink)}
.eq .y{color:var(--yellow)}.eq .r{color:var(--red)}.eq .b{color:var(--blue)}.eq .g{color:var(--green)}
.cons{list-style:none;padding:0;margin:10px 0 0;font-size:13px}
.cons li{padding:4px 0;border-top:1px solid var(--line)}
.cons b{font-family:var(--serif);font-style:italic;color:var(--yellow);font-size:16px;font-weight:normal}
.e{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;fill:none}
.eh{stroke:#8a8a8a;stroke-width:1.6;stroke-dasharray:7 6;fill:none}
.gd{stroke:#b0b0b0;stroke-width:1.4;stroke-dasharray:2 5;stroke-linecap:round;fill:none}
.cs{stroke:var(--yellow);stroke-width:2;stroke-dasharray:7 5;opacity:.95;fill:none}
.cl{stroke:var(--yellow);stroke-width:4.5;stroke-linecap:round;opacity:.9;fill:none}
.arm{stroke:var(--red);stroke-width:4;stroke-linecap:round;fill:none}
.arc{fill:none;stroke:var(--red);stroke-width:3}
.hl{fill:rgba(88,196,221,.18);stroke:var(--blue);stroke-width:1.5}
.hl2{fill:rgba(131,193,103,.16);stroke:var(--green);stroke-width:1.5}
.ra{fill:none;stroke:var(--yellow);stroke-width:1.6}
.lab{font-family:var(--serif);font-style:italic;font-size:20px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.lab.a{fill:#c8c8c8}
.lab.c{fill:var(--yellow)}
.lab.t{fill:var(--red);font-size:22px}
.dim{font-family:var(--sans);font-size:12px;fill:var(--ink2);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.hit{fill:transparent;cursor:pointer}
.face{stroke:none;opacity:.22}
@media (max-width:860px){.app{grid-template-columns:1fr;height:auto}.stage{position:sticky;top:0;z-index:5;height:56vh;height:56svh;border-right:0;border-bottom:1px solid var(--line)}.panel{overflow:visible}.explain{scroll-margin-top:calc(56svh + 10px)}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}


.mode-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.mode{border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 10px;font-size:12px;cursor:pointer;text-align:left;color:var(--ink2);transition:border-color .25s,color .25s,background .25s}
.mode b{display:block;font-family:var(--serif);font-weight:normal;font-size:15px;color:var(--ink);margin-bottom:2px}
.mode:hover{border-color:var(--ink2)}
.mode.on,.mode[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:rgba(88,196,221,.07)}
.mode.on b,.mode[aria-pressed="true"] b{color:var(--blue)}
.prompt{margin:0;font-size:13px;color:var(--ink2);line-height:1.45}
.mode-card{border-color:rgba(88,196,221,.35)}

</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage" tabindex="0" aria-label="3D diagram. Drag to rotate.">
    <svg id="svg" role="img"></svg>
    <div class="ov top"><div class="tag" id="ovTop">Step 1</div></div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="ov bot"><div class="tag"><span class="muted">Drag to rotate</span></div><button class="tag btnish" id="resetView">Reset view</button></div>
  </div>
  <div class="panel" id="panel"></div>
</div>
<script src="scaffold-core.js?v=5"></script>
<script>
/* core: scaffold-core.js */
(()=>{
const P=[8.771991018, -8.18853916, 0],Q=[0, 0, 0],R=[6.358004923, 1.969018528, 11.16685898],S=[14.51201074, 0, 0];
const QS0=14.512011, RQS0=60.720047, DR=11.166859, DP=8.064137;
const st={
  pts:{P:P.slice(),Q:Q.slice(),R:R.slice(),S:S.slice()},
  kind:{P:'v',Q:'v',R:'v',S:'v'},
  edges:[['P','Q'],['Q','S'],['S','P'],['Q','R'],['R','S']],
  yaw:-0.85,pitch:0.4, hints:0, cons:[], tool:null, tsel:[], uiMode:'explore', joins:[], measured:null,
  showSol:false, msg:null, a1:null, a2:null, claim:null, showH:false
};
const HINTS=[
  'Flat: cosine rule in △PQS with ∠QPS = 82° for QS; then sine rule in △QRS with ∠QRS = 65° for ∠RQS.',
  'Fold along QS to dihedral 80°. Shortest distance from R to plane PQS = (dist from R to QS) × sin 80°.',
  'Min PX for X on plane QRS = distance from P to that plane = (dist from P to QS) × sin 80°.',
  'Compare that minimum with 8 cm to judge the claim.'
];
function cen(){return [6,0,3];}
function redraw(){
  applyUiModeClass(st);
  const svg=$('#svg'), W=svg.clientWidth||600, H=svg.clientHeight||500;
  const C0=(typeof cen==='function')?cen():ptsCentroid(st.pts);
  const scale=autoScale(st.pts, st.yaw, st.pitch, C0, W, H, 0.82);
  const proj=p=>project(p,st.yaw,st.pitch,C0,scale,W,H);
  const Pj={}; for(const k in st.pts) Pj[k]=proj(st.pts[k]);
  let html='';
  html+=`<path class="hl" d="${polyPath([Pj.P,Pj.Q,Pj.S])}" fill="rgba(88,196,221,.14)"/>`;
  html+=`<path class="hl2" d="${polyPath([Pj.Q,Pj.R,Pj.S])}" fill="rgba(240,172,95,.16)"/>`;
  [['P','Q'],['Q','S'],['S','P'],['Q','R'],['R','S']].forEach(([a,b])=>{
    let cls='e';
    if((a==='Q'&&b==='S')||(a==='S'&&b==='Q')) cls='cl';
    html+=`<path class="${cls}" d="${linePath(Pj[a],Pj[b])}"/>`;
  });
  if(st.showH){
    // foot from R to plane PQS (z=0): (Rx, Ry, 0)
    const Hpt=[R[0],R[1],0];
    if(!('H' in st.pts)){st.pts.H=Hpt; st.kind.H='c';}
    Pj.H=proj(st.pts.H);
    html+=`<path class="arm" d="${linePath(Pj.R,Pj.H)}"/>`;
    html+=`<text class="dim" x="${Pj.H[0]+6}" y="${Pj.H[1]+14}">perp to PQS</text>`;
  }
  Object.keys(st.pts).forEach(k=>{const p=Pj[k]||proj(st.pts[k]); const col=st.kind[k]==='c'?'var(--yellow)':'var(--ink)';
    html+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${col}" stroke="var(--bg)" stroke-width="2"/>`;
    html+=`<circle class="hit" data-pt="${k}" cx="${p[0]}" cy="${p[1]}" r="26"/>`;
    html+=`<text class="lab ${st.kind[k]==='c'?'c':''}" x="${p[0]+8}" y="${p[1]-8}">${k}</text>`;});
  html+=consOverlayHtml(st, Pj, (typeof proj==='function')?proj:(p=>project(p,st.yaw,st.pitch,[0,0,0],40,600,500)));

  svg.innerHTML=html;
  svg.querySelectorAll('.hit').forEach(el=>el.addEventListener('click',()=>tap(el.dataset.pt)));
  renderPanel();
  $('#ovTop').textContent=st.uiMode==='exam'?'Exam · figure only':modePrefix(st)+(st.claim!==null?'Complete':(st.a2?'Claim PX > 8':(st.a1?'Distance R→PQS':'QS & ∠RQS')));
}
function tap(n){
  if(handleToolTap(st,n,redraw)) return;
}
function checkNum(val,target,tol){const x=parseFloat(val); return !Number.isNaN(x)&&Math.abs(x-target)<=tol;}
function renderPanel(){
  let html=`<div class="head"><div class="brand">Q20 · <i>Fold quad distance</i></div><a class="back" href="index.html">← Index</a></div>
  <div class="card"><div class="eyebrow"><span>Type D · DSE 2024-18</span><span>Long</span></div>
  <p class="qtext">Sheet PQRS: PQ = 12, PS = 10, QR = 13, ∠QPS = 82°, ∠QRS = 65°. Fold along QS; dihedral PQS–QRS = 80°.</p></div>`;
  html+=modeToggleHtml(st);
  if(st.uiMode!=='exam') html+=exploreToolsHtml(st);
  if(st.msg) html+=`<div class="msg ${st.msg.k}">${st.msg.t}</div>`;
  html+=`<div class="card"><div class="sec">Part (a)</div>
  <p class="qtext">Find QS and ∠RQS.</p>
  <div class="actions"><input id="inQS" placeholder="QS cm" style="flex:1;background:#1a1a1a;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px;font:inherit"/>
  <input id="inRQS" placeholder="∠RQS °" style="flex:1;background:#1a1a1a;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px;font:inherit"/>
  <button class="btn dark" id="chkA">Check</button></div>
  ${st.a1?`<p class="eq">QS ≈ <span class="y">${QS0.toFixed(1)}</span> cm · ∠RQS ≈ <span class="y">${RQS0.toFixed(1)}°</span></p>`:''}</div>`;
  html+=`<div class="card"><div class="sec">Part (b)(i)</div>
  <p class="qtext">Shortest distance from R to plane PQS.</p>
  <div class="actions"><input id="inDR" placeholder="cm" style="flex:1;background:#1a1a1a;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px;font:inherit"/>
  <button class="btn dark" id="chkDR" ${st.a1?'':'disabled'}>Check</button></div>
  ${st.a2?`<p class="eq">Distance ≈ <span class="y">${DR.toFixed(1)}</span> cm</p>`:''}</div>`;
  html+=`<div class="card"><div class="sec">Part (b)(ii) · Claim</div>
  <p class="qtext">For any X on plane QRS, PX &gt; 8 cm. Correct?</p>
  <div class="actions"><button class="btn" id="showH" ${st.a2?'':'disabled'}>Show altitude from R</button></div>
  <div class="mc" style="margin-top:8px">
    <button class="btn ${st.claim==='yes'?'picked-good':''}" id="yes" ${st.a2?'':'disabled'}>Yes — claim correct</button>
    <button class="btn ${st.claim==='no'?'picked-bad':''}" id="no" ${st.a2?'':'disabled'}>No — claim incorrect</button>
  </div>
  ${st.claim?`<p class="eq">min PX = dist(P, plane QRS) ≈ <span class="y">${DP.toFixed(2)}</span> cm</p>`:''}</div>`;
    if(st.uiMode==='scaffold') html+=`<div class="card"><div class="sec">Hints · guided</div>
  <p class="prompt">Reveal hints one by one, then return to Explore when ready.</p>
  <div class="actions"><button class="btn dark" id="hintBtn">Next hint (${st.hints}/${HINTS.length})</button>
  <button class="btn" id="backExplore">← Back to Explore</button></div>
  <ol class="hints">${HINTS.slice(0,st.hints).map(h=>`<li>${h}</li>`).join('')}</ol></div>`;
  html+=`<div class="card"><div class="sec">Solution outline</div>
  <button class="btn warn" id="solBtn">${st.showSol?'Hide':'Show'} solution outline</button>
  ${st.showSol?`<div class="explain" style="margin-top:10px"><h3>Solution</h3>
  <p><b>(a)</b> Cosine rule ⇒ QS ≈ <span class="y">${QS0.toFixed(1)}</span>. Sine rule in △QRS ⇒ ∠RQS ≈ <span class="y">${RQS0.toFixed(1)}°</span>.</p>
  <p><b>(b)(i)</b> d(R, PQS) = d(R, QS)·sin 80° ≈ <span class="y">${DR.toFixed(1)}</span> cm.</p>
  <p><b>(b)(ii)</b> min PX = d(P, QS)·sin 80° ≈ <span class="y">${DP.toFixed(2)}</span> &gt; 8. Claim <span class="g">correct</span>.</p>
  </div>`:''}</div>`;
  $('#panel').innerHTML=html;
  wireDualMode(st, redraw);
  const ca=$('#chkA'); if(ca) ca.onclick=()=>{
    if(checkNum($('#inQS').value,QS0,0.4)&&checkNum($('#inRQS').value,RQS0,1.0)){st.a1=true;toast('Part (a) OK','good');}
    else toast('Cosine then sine rule.','bad'); redraw();
  };
  const cd=$('#chkDR'); if(cd) cd.onclick=()=>{
    if(checkNum($('#inDR').value,DR,0.5)){st.a2=true;toast('Distance OK','good');}
    else toast('d(R,QS)·sin 80°.','bad'); redraw();
  };
  const sh=$('#showH'); if(sh) sh.onclick=()=>{st.showH=true;toast('Altitude to PQS','good');redraw();};
  const y=$('#yes'); if(y) y.onclick=()=>{st.claim='yes';toast('min PX ≈ 8.06 > 8','good');st.msg={k:'good',t:'Claim correct.'};redraw();};
  const n=$('#no'); if(n) n.onclick=()=>{st.claim='no';toast('Minimum still exceeds 8.','bad');st.msg={k:'bad',t:'Should accept the claim.'};redraw();};
  const hb=$('#hintBtn'); if(hb) hb.onclick=()=>{if(st.hints<HINTS.length){st.hints++;redraw();}};
  const sb=$('#solBtn'); if(sb) sb.onclick=()=>{st.showSol=!st.showSol;st.showH=true;redraw();};
}
makeDrag($('#stage'),$('#svg'),()=>({yaw:st.yaw,pitch:st.pitch}),(y,p)=>{st.yaw=y;st.pitch=p;},redraw);
$('#resetView').onclick=()=>{st.yaw=-0.85;st.pitch=0.4;redraw();};
window.addEventListener('resize',redraw); redraw();
})();

</script>
</body>
</html>
